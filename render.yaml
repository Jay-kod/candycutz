databases:
  - name: candycutz-postgres
    databaseName: candycutz
    user: candycutz
    plan: free

services:
  - type: web
    name: candycutz-api
    runtime: docker
    plan: free
    rootDir: barbing-saloon-api
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: CandyCutz
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: candycutz-postgres
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: candycutz-postgres
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "true"
      - key: JWT_SECRET
        sync: false

  - type: worker
    name: candycutz-worker
    runtime: docker
    plan: free
    rootDir: barbing-saloon-api
    dockerCommand: php artisan queue:work --tries=3 --max-time=3600
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: candycutz-postgres
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: candycutz-postgres
          property: connectionString
      - key: QUEUE_CONNECTION
        value: database
